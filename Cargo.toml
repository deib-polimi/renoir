[package]
name = "renoir"
description = "Reactive Network of Operators In Rust"
version = "0.6.1"
edition = "2021"
authors = [
    "Luca De Martini <luca.demartini@polimi.it>",
    "Edoardo Morassutto <edoardo.morassutto@gmail.com>",
    "Marco Donadoni <marco.donadoni@mail.polimi.it>"
]
license = "LGPL-3.0-or-later"
repository = "https://github.com/deib-polimi/renoir"
homepage = "https://github.com/deib-polimi/renoir"
readme = "README.md"

[features]
default = ["clap", "ssh", "timestamp"]
timestamp = []
ssh = ["ssh2", "whoami", "shell-escape", "sha2", "base64"]
tokio = ["dep:tokio", "dep:futures", "tokio/net", "tokio/io-util", "tokio/time", "tokio/rt-multi-thread", "tokio/macros"]
avro = ["dep:apache-avro"]
profiler = []
parquet = ["dep:parquet", "dep:arrow"]
rdkafka = ["dep:rdkafka", "tokio"]
# parquet = ["dep:parquet", "dep:arrow"]

[dependencies]
# for logging to the console
log = { version = "0.4.29", features = ["release_max_level_info"] }

# used by the network for storing type-generic structures
typemap_rev = "0.4.0"

# the shuffle() operator requires a random source
nanorand = "0.8.0"

# utility macros for customizing the derive Debug, Default, ...
derivative = "2.2.0"

# serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = { version = "2.0.1", features = ["serde"] }
toml = "1.1.2"

thiserror = "2.0.18"

# handy iterators functions

# for storing non-mutable static variables with non-trivial initialization
once_cell = "1.21.4"

# used for spawning the remote workers
ssh2 = { version = "0.9.5", optional = true }
russh = { version = "0.60.0", optional = true }
whoami = { version = "2.1.1", optional = true }
shell-escape = { version = "0.1.5", optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
sha2 = { version = "0.11.0", optional = true }
base64 = { version = "0.22.1", optional = true }

# channel implementation
flume = "0.12.0"

# used for csv file source
csv = "1.4.0"

# Lazy with support for delayed and synchronized initialization
lazy-init = "0.5.1"

# Faster monotonic clock using libc's CLOCK_MONOTONIC_COARSE
coarsetime = "0.1.37"

tokio = { version = "1.51.0", features = ["rt"], default-features = false, optional = true }
smol = { version = "2.0.2", default-features = false}
futures = { version = "0.3.32", optional = true }

parking_lot = "0.12.5"

wyhash = "0.6.0"
fxhash = "0.2.1"
glidesort = "0.1.2"
indexmap = "2.13.1"
tracing = { version = "0.1.44", features = ["log"] }
quick_cache = "0.6.21"
dashmap = "6.1.0"
dyn-clone = "1.0.20" 

apache-avro = { version = "0.21.0", features = ["derive"], optional = true }
parquet = { version = "57.0.0", optional = true }
arrow = { version = "57.0.0", optional = true }
rdkafka = { version = "0.39.0", optional = true }
serde_bytes = "0.11.19"

[dev-dependencies]
# for the tests
env_logger = "0.11.10"
rand = { version = "0.10.0" }
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
fake = "5.1.0"
mimalloc = { version = "0.1.48", default-features = false }
tracing-subscriber = "0.3.23"
itertools = "0.14.0"

micrometer = { version = "0.2.7", features = ["enable"]}

# for the examples
regex = "1.12.3"

kstring = { version = "2.0.2", features = ["serde"] }
nexmark = { version = "0.2.0", features = ["serde"] }
proptest = "1.11.0"

[[example]]
name = "nexmark"
required-features = ["timestamp"]

[[example]]
name = "avro_rw"
required-features = ["avro"]

[[example]]
name = "parquet_rw"
required-features = ["parquet"]

[[example]]
name = "rolling_top_words"
required-features = ["timestamp"]

[[example]]
name = "rolling_top_words_e2e"
required-features = ["timestamp"]

[[example]]
name = "kafka"
required-features = ["rdkafka"]

[[example]]
name = "kafka_wordcount"
required-features = ["rdkafka"]

# The list of benchmarks, all of them require "harness = false" in order to
# work with criterion.rs. Cannot set `[lib] harness = false` because the tests
# require the harness.
[[bench]]
name = "collatz"
harness = false
[[bench]]
name = "connected"
harness = false
[[bench]]
name = "wordcount"
harness = false
[[bench]]
name = "shuffle"
harness = false
[[bench]]
name = "fold_vs_reduce"
harness = false
[[bench]]
name = "batch_mode"
harness = false
[[bench]]
name = "nexmark"
harness = false
[[bench]]
name = "serde"
harness = false
[[bench]]
name = "caching"
harness = false
[[bench]]
name = "kafka"
harness = false
required-features = ["rdkafka"]


[profile.release]
lto = true

[profile.bench]
inherits = "release"
debug = 1

[profile.release-fast]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
